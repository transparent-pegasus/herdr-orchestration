# Shipped defaults for the orchestration skill: the role list, and the
# role assigned to every delegation task.
#
# THIS FILE IS THE DEFAULT, NOT THE PLACE TO CUSTOMIZE A REPO.
# A target repository overrides any key below in its own hand-written
# `.herdr-orchestration/config.yaml` — that file wins key by key, and anything
# it omits falls back here. A selected profile then overrides its present
# role, fallback, delegation, and assignment keys. Plugin installations are
# read-only (an update clobbers local edits), so the repo file is the only
# durable layer. See "Configuration resolution" in SKILL.md and
# references/profiles.md.

# Composition selection and process lifecycle are separate from delegation.
# `profile` names a file in the repo's `.herdr-orchestration/profiles/` or,
# failing that, the skill's `profiles/`; null selects none.
# using-herdr-sibling-panes/scripts/agent-lifecycle.sh reads
# allow_agent_lifecycle (and the frozen resolved delegation.pane_scope): only a
# literal `true` in the repository's config lets the orchestrator start or end
# agents in panes.
#
# reviewer_usage_limit decides what a review gate does when a reviewer hits a
# usage limit and no fallback substitute can take its review (config-only):
#   wait  hold the gate until that reviewer's limit resets, then finish its review
#   skip  pass the gate on the remaining reviewers and report the skipped one;
#         with no reviewer left, hold the gate as with wait
# See "Exhaustion and fallback" in SKILL.md.
profile: null
allow_agent_lifecycle: false
reviewer_usage_limit: skip

# ---------------------------------------------------------------------------
# Role list. Roles bind to agent types, not to reserved panes: at delegation
# time, any idle pane of the matching agent type can take the task.
# `orchestrator` is an alias for the active owner: the reception pane without
# a profile, or the owner resolved by the selected profile.
#
# Targets use one-key mappings: {kind: {model: <string>, effort: <string>}}.
# Settings are optional; effort requires model, and effort `any` lets the
# active owner pick the effort per task. Preserve their spelling and verify
# live footer evidence, not config or launch flags. Legacy bare kinds and
# kind@model role entries remain readable, with a deprecation notice for the
# latter. One type may fill two list slots only on distinct pinned models.
#
# Each role key's value is its binding. A single target or `orchestrator`
# binds one agent type: one task, one delegation. A list binds several and
# means ONE DELEGATION PER ENTRY — the task runs once per listed entry, in
# separate panes. That is what makes a review a double review; it is a
# property of the role, not of any one task.
# See "Roles that bind to a list" in SKILL.md.
# Key comments say what each role does; copy the pattern for a custom role.
# Legacy `agent:`/`agents:`/`description:` sub-keys and the old `reviewer`
# key remain readable.
# ---------------------------------------------------------------------------
roles:
  planning-design: orchestrator # planning and design work
  decision-maker: orchestrator # plan resolution, review-finding acceptance, execution rulings, and final synthesis decisions
  reviewers: # independent review: plans, designs, integrated code; one per entry
    - opencode:
        model: GPT-6.2 Astra
    - cursor:
        model: Gemini 4 Argon
    - cursor:
        model: Grok 4.7
    - cursor:
        model: Muse Spark 1.3
  coder: # complex coding (see "Complex coding boundary" in references/routing.md)
    opencode:
      model: GPT-6.2 Sol
  generalist: orchestrator # simple coding, search, file inspection, tests, lint, routine operations

# Substitutes for an agent that cannot take work right now — usage/rate limit
# reached, no pane of that type in scope, or every pane of that type crashed.
# Lifecycle actions require the separate top-level permission.
# See "Exhaustion and fallback" in SKILL.md.
#
# Tried left to right; the first substitute with a usable idle pane wins.
# Nested kind+model becomes kind@model for lookup, then bare kind only if the
# exact key is absent. A matched [] is authoritative; lists never concatenate.
# Fallback keys/substitutes keep string syntax and have no effort constraint.
# The two different Wonder spellings are intentional user strings;
# do not repair them or add fuzzy aliases (see references/profiles.md).
# An agent with no entry here has no substitute.
fallbacks:
  opencode@GPT-6.2 Astra: [codex@GPT-6.2-Astra, codex]
  opencode@GPT-6.2 Sol: [codex@GPT-6.2-Sol, codex]
  cursor@Gemini 4 Argon: [agy@Gemini 4 Argon, agy]
  cursor@Grok 4.7: [grok@Grok 4.7, grok]
  cursor@Muse Spark 1.3: [muse@Muse Spark 1.3, muse]
  # Keep the bare-type fallback for existing repo overrides.
  cursor: [grok]
  # Targets of the shipped profiles.
  claude@Fable 5.2: [cursor@Claude Fable 5.2]
  claude@Opus 5.5: [cursor@Claude Opus 5.5, claude]
  codex@GPT-6.2-Astra: []
  codex@GPT-6.2-Sol: [codex]
  muse@muse-wonder-1.0: [cursor@Muse Wonder]
  agy@Gemini 4 Argon: [cursor@Gemini 4 Argon, opencode@Gemini 4 Argon]
  grok@Grok 4.7: [cursor@Grok 4.7, opencode@Grok 4.7]

# ---------------------------------------------------------------------------
# Delegation defaults that apply to every task. See "Delegation scope" and
# "Unavailable targets and the subagent fallback" in SKILL.md.
# ---------------------------------------------------------------------------
delegation:
  # Which panes may receive a delegation, relative to the orchestrator pane.
  # `herdr pane list` reports `pane_id`, `tab_id`, `workspace_id`, and `cwd`
  # for every pane, so the filter is a field comparison, not a guess.
  #   tab        only panes whose `tab_id` equals the orchestrator's. The
  #              default: a tab is how a herdr user separates projects, so a
  #              pane in another tab is usually another repository's pane.
  #   workspace  any pane in the orchestrator's `workspace_id`, any tab
  #   session    every agent pane herdr reports
  pane_scope: tab

  # What happens when a separate target is unavailable — no live in-scope
  # match, none started, and no usable fallback substitute.
  #   true   run the delegation in a fresh in-process subagent of the active
  #          owner's own agent kind, with the same brief; the report names it
  #          and the target constraints it lost. The default.
  #   false  degrade as before: report it, and run safe work in the owner.
  # A strict boolean. Exhausted targets keep their own rules.
  subagent_fallback: true

# ---------------------------------------------------------------------------
# Delegation tasks, each assigned a role. This is the routing table: the skill
# reads it instead of hard-coding "complex coding goes to Coder".
#
# Every task takes the same knobs:
#   role     — which role from the list above performs it
#   mode     — where it runs:
#                delegate     a fresh idle pane of `role`, via
#                             using-herdr-sibling-panes; a selected-profile
#                             self-target requires a fresh in-process subagent
#                orchestrator the orchestrator pane itself. A work task runs
#                             inline. Without a profile, a review uses a fresh
#                             subagent; with a profile it may be self-review
#   enabled  — review tasks only: `false` removes the gate entirely.
#              Work tasks are mandatory; to stop delegating one, set
#              `mode: orchestrator` rather than disabling it.
#
# Every non-default assignment, every non-default mode, and every disabled
# review is named in the final report.
# ---------------------------------------------------------------------------
assignments:

  # --- work tasks (mandatory; `mode` decides whether they are delegated) ---

  plan-and-design:
    description: Brainstorming, design docs, and implementation plans
    role: planning-design
    mode: orchestrator # the orchestrator holds the design context; delegating loses it
  decision-making:
    description: >-
      Plan resolution and finding disposition, reviewer disagreement
      adjudication, mid-execution rulings, and final synthesis decisions
    role: decision-maker
    mode: orchestrator # active owner decides unless a profile or config delegates decisions
  complex-coding:
    description: Implementation tasks over the "Complex coding boundary" in references/routing.md
    role: coder
    mode: delegate
  simple-coding:
    description: Localized, pattern-following edits under that same boundary
    role: generalist
    mode: orchestrator
  chores:
    description: Lookups, file moves, log gathering, mechanical edits, lint/format runs
    role: generalist
    mode: orchestrator
  verification:
    description: >-
      Running the repository's build, test, and lint commands. A delegated run
      is a claim: the orchestrator accepts it on the quoted output in the
      report file, or re-executes the decisive command itself. With
      `mode: orchestrator` its own command output is the evidence.
    role: generalist
    mode: orchestrator

  # --- review tasks (optional; `enabled: false` removes the gate) ---

  plan-review:
    description: Independent review of a plan or design before it is acted on
    role: reviewers
    mode: delegate
    enabled: true
  integration-review:
    description: >-
      Independent review of the integrated result when implementation was
      split across multiple panes; a single-implementer task skips it
    role: reviewers
    mode: delegate
    enabled: true
